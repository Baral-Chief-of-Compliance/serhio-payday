# Конфиг для сервера. Скопировать в /etc/nginx/sites-available/serhio-payday.conf
# и сделать симлинк:
#   sudo ln -s /etc/nginx/sites-available/serhio-payday.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (443) терминируется на стороне хостинга — этот конфиг отдаёт только 80,
# сюда приходит уже расшифрованный HTTP-трафик.
#
# Порты 10001/10002/10003 берутся из docker-compose.yaml (ports: секции сервисов
# centrifugo/backend/frontend). Если поменяешь порты в compose — поменяй и здесь.

upstream serhio_payday_backend {
    server 127.0.0.1:10002;
}

upstream serhio_payday_centrifugo {
    server 127.0.0.1:10001;
}

upstream serhio_payday_frontend {
    server 127.0.0.1:10003;
}

server {
    listen 80;
    listen [::]:80;
    server_name serhio.payday.polartitan.ru;

    client_max_body_size 10m;

    # --- FastAPI backend, доступен на фронте как /api/... ---
    # NUXT_PUBLIC_API_BASE=https://serhio.payday.polartitan.ru/api,
    # а роуты backend'а объявлены без префикса (/ticks, /balance) —
    # поэтому proxy_pass с завершающим "/" срезает "/api".
    location /api/ {
        proxy_pass http://serhio_payday_backend/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Centrifugo WebSocket ---
    # NUXT_PUBLIC_CENTRIFUGO_WS_URL=wss://serhio.payday.polartitan.ru/connection/websocket
    location /connection/ {
        proxy_pass http://serhio_payday_centrifugo/connection/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 65s;
    }

    # --- Nuxt frontend ---
    location / {
        proxy_pass http://serhio_payday_frontend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
